name: Weekly database backup

# Exports the production D1 database every week into the private R2 bucket
# "luvnote-backups" (never to GitHub: this repository is public). Logs show only size and hash.
on:
  schedule:
    - cron: '23 20 * * 0'   # Sunday 20:23 UTC = Monday 03:23 Bangkok, a quiet hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-card-api
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure production D1 id
        run: node --input-type=module -e 'import fs from "node:fs"; const id=process.env.PRODUCTION_D1_ID;if(!/^[0-9a-f-]{36}$/.test(id))process.exit(1);fs.writeFileSync("wrangler.toml",fs.readFileSync("wrangler.toml","utf8").replace("__D1_ID__",id));'
      - name: Export and upload
        run: |
          set -euo pipefail
          umask 077
          name="d1/luvnote-$(date -u +%Y-%m-%dT%H%MZ).sql.gz"
          npx wrangler d1 export luvnote --remote --output "$RUNNER_TEMP/backup.sql" > /dev/null
          grep -q 'CREATE TABLE' "$RUNNER_TEMP/backup.sql"
          gzip -9 "$RUNNER_TEMP/backup.sql"
          size=$(stat -c %s "$RUNNER_TEMP/backup.sql.gz"); sum=$(sha256sum "$RUNNER_TEMP/backup.sql.gz" | cut -c1-16)
          npx wrangler r2 object put "luvnote-backups/$name" --file "$RUNNER_TEMP/backup.sql.gz" --content-type application/gzip --remote > /dev/null
          npx wrangler r2 object get "luvnote-backups/$name" --file "$RUNNER_TEMP/check.sql.gz" --remote > /dev/null
          cmp "$RUNNER_TEMP/backup.sql.gz" "$RUNNER_TEMP/check.sql.gz"
          rm -f "$RUNNER_TEMP"/backup.sql* "$RUNNER_TEMP"/check.sql.gz
          echo "Backup stored: luvnote-backups/$name ($size bytes, sha256 $sum…)" | tee -a "$GITHUB_STEP_SUMMARY"
