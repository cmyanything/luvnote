name: Browser JPEG upload compatibility

on:
  pull_request:
    paths:
      - 'src/lib/images.ts'
      - 'worker/jpeg.js'
      - 'tests/browser-jpeg.test.mjs'
      - 'tests/fixtures/apple-canvas-900.jpg'
      - '.github/workflows/browser-jpeg.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/images.ts'
      - 'worker/jpeg.js'
      - 'tests/browser-jpeg.test.mjs'
      - 'tests/fixtures/apple-canvas-900.jpg'
      - '.github/workflows/browser-jpeg.yml'

permissions:
  contents: read

jobs:
  apple-jpeg:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: node --test tests/browser-jpeg.test.mjs
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
      - run: npx playwright test tests/r2-acceptance.spec.ts --project=webkit-mobile --grep 'coquette-dream|anniversary-journey'
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: synthetic-browser-jpeg
          path: test-results/jpeg/
          retention-days: 7
