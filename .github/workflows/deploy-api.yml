name: Owner-approved card API deployment

on:
  workflow_dispatch:
    inputs:
      approval:
        description: Type OWNER_APPROVED_PRODUCTION after reviewing the readiness report
        required: true
        type: string
      approved_commit:
        description: Exact main commit approved by the Owner
        required: true
        type: string
      apply_schema:
        description: Explicitly approve the additive production D1 migration
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-card-api
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && inputs.approval == 'OWNER_APPROVED_PRODUCTION' && inputs.approved_commit == github.sha
    environment: production
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_D1_ID: ${{ vars.PRODUCTION_D1_ID }}
      CONFIG_VERIFIED: ${{ vars.R2_PRODUCTION_CONFIG_VERIFIED }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run test:api
      - name: Require explicit resource configuration
        run: |
          test "$CONFIG_VERIFIED" = "true"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PRODUCTION_D1_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module -e 'import fs from "node:fs"; const id=process.env.PRODUCTION_D1_ID;if(!/^[0-9a-f-]{36}$/.test(id))process.exit(1);fs.writeFileSync("wrangler.toml",fs.readFileSync("wrangler.toml","utf8").replace("__D1_ID__",id));'
      # Back up the database automatically before touching production (same as the weekly backup).
      - name: Back up the database first
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          umask 077
          name="d1/luvnote-$(date -u +%Y-%m-%dT%H%MZ)-predeploy.sql.gz"
          npx wrangler d1 export luvnote --remote --output "$RUNNER_TEMP/backup.sql" --config wrangler.toml > /dev/null
          grep -q 'CREATE TABLE' "$RUNNER_TEMP/backup.sql"
          gzip -9 "$RUNNER_TEMP/backup.sql"
          npx wrangler r2 object put "luvnote-backups/$name" --file "$RUNNER_TEMP/backup.sql.gz" --content-type application/gzip --remote > /dev/null
          npx wrangler r2 object get "luvnote-backups/$name" --file "$RUNNER_TEMP/check.sql.gz" --remote > /dev/null
          cmp "$RUNNER_TEMP/backup.sql.gz" "$RUNNER_TEMP/check.sql.gz"
          rm -f "$RUNNER_TEMP"/backup.sql* "$RUNNER_TEMP"/check.sql.gz
          echo "Backup stored: luvnote-backups/$name" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify provisioned bucket and secret names
        run: |
          npx wrangler r2 bucket info luvnote-media
          npx wrangler secret list --name luvnote-api > /tmp/luvnote-secret-names.json
          node -e 'const names=require("/tmp/luvnote-secret-names.json");if(!names.some(s=>s.name==="TURNSTILE_SECRET_KEY"))process.exit(1)'
      - name: Apply explicitly approved additive schema
        if: inputs.apply_schema
        run: npx wrangler d1 execute luvnote --remote --file worker/schema.sql --config wrangler.toml
      - name: Verify required schema exists
        run: |
          npx wrangler d1 execute luvnote --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('media_assets','media_upload_sessions','media_upload_jobs','media_publications','media_write_budgets','media_cleanup_state')" > /tmp/luvnote-schema.json
          node -e 'const r=require("/tmp/luvnote-schema.json");if(r[0]?.results?.length!==6)process.exit(1)'
      - name: Deploy backend with V3 writes disabled
        run: npx wrangler deploy --config wrangler.toml
      - name: Read-only health check must succeed
        run: curl --fail --retry 4 --retry-delay 5 https://api.luvnote.fun/health
