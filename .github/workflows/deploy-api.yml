name: Deploy card API to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Find Cloudflare account
        run: |
          ACC=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts \
            | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));if(!r.result||!r.result.length){console.error(JSON.stringify(r.errors));process.exit(1)}console.log(r.result[0].id)')
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"

      - name: Find D1 database "luvnote"
        run: |
          DB_ID=$(wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="luvnote");if(!d){console.error("D1 database luvnote not found");process.exit(1)}console.log(d.uuid)')
          sed -i "s/__D1_ID__/$DB_ID/" wrangler.toml
          echo "D1 id: $DB_ID"

      - name: Create table
        run: wrangler d1 execute luvnote --remote --file worker/schema.sql

      - name: Deploy worker
        run: wrangler deploy

      - name: Smoke test
        run: |
          sleep 20
          curl -fsS https://api.luvnote.fun/health || echo "api.luvnote.fun not reachable yet (custom domain may still be provisioning)"
