name: Frontend checks and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older run that is still testing (the newest code deploys anyway).
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests run inside Microsoft's Playwright image (browsers + system libraries preinstalled),
  # so no job waits on apt/browser downloads (those used to hang for up to an hour).
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  legacy-tests:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/media-v3.js && node --check scripts/smoke-r2-staging.mjs
      - run: npm run test:api
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'false'
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: legacy-playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  media-tests:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
      - run: npx playwright test tests/media-v3.spec.ts tests/r2-acceptance.spec.ts
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: media-playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  check:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versions.outputs.playwright }}-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never ship the Cloudflare testing site key or a missing real key to production.
      - name: Check production Turnstile rollout guard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MEDIA_MODE: ${{ vars.VITE_R2_MEDIA_ENABLED }}
          SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          BACKEND_VERIFIED: ${{ vars.R2_PRODUCTION_CONFIG_VERIFIED }}
        run: |
          if [ "$MEDIA_MODE" = "true" ]; then
            if [ "$BACKEND_VERIFIED" != "true" ] || ! [[ "$SITE_KEY" =~ ^0x[A-Za-z0-9_-]+$ ]]; then
              echo "::error::V3 cannot deploy without a genuine Turnstile site key"
              exit 1
            fi
          fi
      # Build the actual deployable artifact using explicitly configured repository vars.
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: ${{ vars.VITE_R2_MEDIA_ENABLED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      # Owner-approved public developer preview. Keep its files inside /mylab only.
      - run: node scripts/check-template-lab-isolation.mjs
      - run: npm run lab:build
        env:
          LAB_BASE_PATH: /mylab/
      - run: node scripts/package-template-lab.mjs
      - run: npx playwright test --config playwright.mylab.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, legacy-tests, media-tests]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
