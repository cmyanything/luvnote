name: Frontend checks and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/media-v3.js && node --check scripts/smoke-r2-staging.mjs
      - run: node --test tests/media-v3.test.mjs
      # Legacy compatibility tests use the old creation API.
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Validate the new binary-upload path against mocked API requests.
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
      - run: npx playwright test tests/media-v3.spec.ts
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
      # Never ship the Cloudflare testing site key or a missing real key to production.
      - name: Check production Turnstile rollout guard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MEDIA_MODE: ${{ vars.VITE_R2_MEDIA_ENABLED }}
          SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [ "$MEDIA_MODE" = "true" ]; then
            if [ -z "$SITE_KEY" ] || [ "$SITE_KEY" = "1x00000000000000000000AA" ] || [ "$SITE_KEY" = "2x00000000000000000000AB" ]; then
              echo "::error::V3 cannot deploy without a genuine Turnstile site key"
              exit 1
            fi
          fi
      # Build the actual deployable artifact using explicitly configured repository vars.
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: ${{ vars.VITE_R2_MEDIA_ENABLED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
