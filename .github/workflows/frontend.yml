name: Frontend checks and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the anniversary API
        run: |
          node --input-type=module <<'NODE'
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch('https://api.luvnote.fun/health', { signal: AbortSignal.timeout(5000) });
              const health = await response.json();
              if (response.ok && health.themes?.includes('anniversary-journey')) process.exit(0);
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.error('The anniversary API is not ready; leaving the current frontend deployed.');
          process.exit(1);
          NODE
      - uses: actions/deploy-pages@v5
        id: deployment
