name: Frontend checks and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/media-v3.js && node --check scripts/smoke-r2-staging.mjs
      - run: npm run test:api
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'false'
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: legacy-playwright-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  media-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
          VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/media-v3.spec.ts tests/r2-acceptance.spec.ts --shard=${{ matrix.shard }}/2
        env:
          VITE_R2_MEDIA_ENABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: media-playwright-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      # Never ship the Cloudflare testing site key or a missing real key to production.
      - name: Check production Turnstile rollout guard
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          MEDIA_MODE: ${{ vars.VITE_R2_MEDIA_ENABLED }}
          SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          BACKEND_VERIFIED: ${{ vars.R2_PRODUCTION_CONFIG_VERIFIED }}
        run: |
          if [ "$MEDIA_MODE" = "true" ]; then
            if [ "$BACKEND_VERIFIED" != "true" ] || ! [[ "$SITE_KEY" =~ ^0x[A-Za-z0-9_-]+$ ]]; then
              echo "::error::V3 cannot deploy without a genuine Turnstile site key"
              exit 1
            fi
          fi
      # Build the actual deployable artifact using explicitly configured repository vars.
      - run: npm run build
        env:
          VITE_R2_MEDIA_ENABLED: ${{ vars.VITE_R2_MEDIA_ENABLED }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      # Owner-approved public developer preview. Keep its files inside /mylab only.
      - run: node scripts/check-template-lab-isolation.mjs
      - run: npm run lab:build
        env:
          LAB_BASE_PATH: /mylab/
      - run: node scripts/package-template-lab.mjs
      - run: npx playwright test --config playwright.mylab.config.ts
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, legacy-tests, media-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
