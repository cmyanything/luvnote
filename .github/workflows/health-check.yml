name: Site health check

# Hourly read-only check of the live site and API. A failed scheduled run makes GitHub
# email the repository owner, so outages are noticed before customers report them.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Card API is healthy
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors https://api.luvnote.fun/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

      - name: API routes answer without server errors
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 "$1"; }
          v2=$(status https://api.luvnote.fun/v2/cards/zzzzzzz)
          media=$(status https://api.luvnote.fun/v3/cards/zzzzzzz/media/00000000-0000-4000-8000-000000000000)
          echo "unknown card: $v2, unknown photo: $media (both should be 404)"
          [ "$v2" = 404 ] && [ "$media" = 404 ]

      - name: Website and editor load
        run: |
          curl -fsS --retry 3 --retry-delay 10 -o home.html https://luvnote.fun/
          grep -q 'LuvNote' home.html
          for theme in pink-coquette coquette-dream little-memories birthday-chat velvet-gift anniversary-journey villa-amore; do
            page=$(curl -fsS --retry 3 --retry-delay 10 "https://luvnote.fun/themes/$theme/")
            asset=$(printf '%s' "$page" | grep -oE 'src="[^"]*assets/[^"]+\.js"' | head -1 | sed -E 's/^src="(\.\.\/)*\.?\/?//; s/"$//')
            [ -n "$asset" ] || { echo "::error::$theme editor has no script"; exit 1; }
            curl -fsS --retry 3 -o /dev/null "https://luvnote.fun/$asset"
            echo "$theme OK ($asset)"
          done
