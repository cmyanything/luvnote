name: Creative Template Lab

on:
  pull_request:
    paths:
      - 'src/template-lab/**'
      - 'template-lab/**'
      - 'tests/lab/**'
      - '*lab.config.ts'
      - 'scripts/*template-lab*'
      - 'package*.json'
      - '.github/workflows/template-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: '360', shard: '1/1', label: '360' }
          - { project: '390', shard: '1/1', label: '390' }
          - { project: '768', shard: '1/1', label: '768' }
          - { project: 'desktop', shard: '1/1', label: 'desktop' }
          - { project: 'webkit', shard: '1/3', label: 'webkit-1' }
          - { project: 'webkit', shard: '2/3', label: 'webkit-2' }
          - { project: 'webkit', shard: '3/3', label: 'webkit-3' }
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-template-lab-isolation.mjs
      - run: npm run lab:build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config playwright.lab.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: creative-lab-test-evidence-${{ matrix.label }}
          path: |
            lab-results/
            lab-playwright-report/
          retention-days: 7
