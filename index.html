<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuvNote — การ์ดดิจิทัล ส่งความรู้สึกด้วยลิงก์เดียว</title>
<meta name="theme-color" content="#FFFFFF">
<script>
(function(){var h=location.hash.slice(1);
if(/^p[a-z0-9]{7}$/.test(h)){location.replace("themes/pink-coquette/card.html?v=6#"+h.slice(1));return;}
if(/^d[a-z0-9]{7}$/.test(h)){location.replace("themes/coquette-dream/card.html?v=3#"+h.slice(1));return;}
if(/^m[a-z0-9]{7}$/.test(h)){location.replace("themes/little-memories/card.html?v=4#"+h.slice(1));return;}
if(/^c[a-z0-9]{7}$/.test(h)){location.replace("themes/birthday-chat/card.html?v=1#"+h.slice(1));return;}
if((/^[a-z0-9]{7}$/.test(h)&&h!=="pricing"&&h!=="contact")||/^[cd]-[0-9a-v]+$/.test(h))location.replace("app/#"+h);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;500;600;700&family=Mali:wght@600;700&family=Mitr:wght@400;500&family=Athiti:wght@500;600&display=swap" rel="stylesheet">
<style>
/* LuvNote catalog v2 — layout like a mini card shop:
   centered logo header, icon category tabs, 2-col picture grid with "ดูตัวอย่าง" pills, floating "วิธีสั่งทำ".
   White + vivid wine red lead; cream only as a soft note. */
:root{
  --wine:#A1002E;--wine-d:#800020;--wine-l:#C8264F;--wine-t:#FCEBEF;--wine-t2:#F7D3DC;
  --ink:#2B0A12;--ink2:#6B4A52;--ink3:#A8939A;
  --cream:#FFF9EE;--white:#fff;--bg:#FFFFFF;
  --blush:#FBE6E8;--blush2:#F2C4C8;--cheek:#EE97A3;--gold:#C2A06A;
  --line:#F1E3E7;--line2:rgba(161,0,46,.22);
  --r1:#A1002E;--r2:#6E0020;--r3:#C8264F;--r4:#4A0014;--paper:#fff;
  --sh:0 1px 2px rgba(110,0,32,.05),0 12px 28px -14px rgba(110,0,32,.28);
  --serif:"Fredoka",sans-serif;
  --sans:"Mitr",system-ui,sans-serif;
  --cute:"Mali",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font:400 15px/1.6 var(--sans);background:var(--bg);color:var(--ink);overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
.head{position:relative;background:linear-gradient(180deg,#fff 0%,#FFF8F9 100%);overflow:hidden}
.brand{position:relative;height:96px;display:grid;place-items:center}
.logo{position:relative;display:inline-flex;align-items:center;gap:2px;font:700 italic 40px/1 var(--serif);color:var(--wine);letter-spacing:.01em}
.logo .lh{width:20px;height:20px;fill:var(--wine);margin:-14px 0 0 2px;animation:beat 2.4s var(--ease) infinite}
.logo .crown{position:absolute;width:40px;top:-20px;left:-8px;transform:rotate(-14deg);animation:crownW 3.2s ease-in-out infinite}
.logo::after{content:"";position:absolute;left:8%;right:4%;bottom:-8px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--wine-l),transparent);opacity:.5}
.tag-line{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:500 10px/1 var(--sans);letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
.hbtn{position:absolute;top:50%;margin-top:-21px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--wine);background:#fff;border:1px solid var(--line);transition:transform .35s var(--spring),background .3s}
.hbtn:active{transform:scale(.9)}
.hbtn.r{right:16px}
.hbtn svg{width:21px;height:21px}
/* decorations (instead of cobwebs: ribbons, hearts, mochi) */
.deco{position:absolute;pointer-events:none}
.ribbon-l,.ribbon-r{top:0;width:120px;height:90px}
.ribbon-l{left:-6px}.ribbon-r{right:-6px;transform:scaleX(-1)}
.ribbon-l path,.ribbon-r path{fill:none;stroke:var(--wine-t2);stroke-width:1.3}
.hang{top:0;width:1px;background:var(--wine-t2);transform-origin:top;animation:swing 3.6s ease-in-out infinite}
.hang svg{position:absolute;bottom:-14px;left:-9px;width:18px;fill:var(--wine-l)}
.d-mochi{width:38px;opacity:.9;animation:float 4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(.95)}45%{transform:scale(1.12)}}
@keyframes crownW{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-4deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

/* ---------- icon tabs ---------- */
.tabs-bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:box-shadow .3s}
.tabs-bar.stuck{box-shadow:0 8px 22px -16px rgba(110,0,32,.45)}
.tabs-in{position:relative;max-width:1080px;margin:0 auto}
.tabs{position:relative;display:flex;overflow-x:auto;scrollbar-width:none;padding:6px 10px 0;scroll-behavior:smooth}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 10px;border-radius:14px 14px 0 0;color:var(--ink2);transition:color .35s,background .35s}
.tab .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;transition:transform .45s var(--spring),background .35s}
.tab .ic svg{width:20px;height:20px;stroke-width:1.8}
.tab span{font:500 13px/1 var(--sans);white-space:nowrap}
.tab:active .ic{transform:scale(.88)}
.tab.on{color:var(--wine);background:linear-gradient(180deg,var(--wine-t) 0%,rgba(252,235,239,0) 100%)}
.tab.on .ic{background:var(--wine);color:#fff;transform:translateY(-2px) rotate(-6deg);box-shadow:0 8px 16px -8px rgba(161,0,46,.8)}
.tab.on span{font-weight:600}
.tab-ind{position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--wine);transition:transform .5s var(--spring),width .5s var(--spring)}
.tabs-more{position:absolute;right:0;top:0;bottom:1px;width:46px;display:grid;place-items:center;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 55%);color:var(--wine);transition:opacity .3s}
.tabs-more svg{width:20px;height:20px;animation:nudge 1.6s ease-in-out infinite}
.tabs-more.hide{opacity:0;pointer-events:none}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}

/* ---------- list ---------- */
main{background:#FFFBFC;min-height:70vh;padding-bottom:110px}
.list-head{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 14px}
.list-head h1{font:600 24px/1.2 var(--sans);color:var(--ink);display:flex;align-items:center;gap:8px}
.list-head h1 i{width:8px;height:8px;border-radius:50%;background:var(--wine);display:inline-block;animation:beat 2s infinite}
.count{font:500 14px/1 var(--sans);color:var(--ink3)}
.count b{color:var(--wine);font-weight:600;display:inline-block}
.count b.pop{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.4)}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:28px 20px}}
.grid.out .item{opacity:0;transform:translateY(10px) scale(.97);transition:opacity .2s,transform .2s}

.item{cursor:pointer;display:block}
.item.enter{opacity:0;transform:translateY(24px);animation:itemIn .7s var(--ease) forwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes itemIn{to{opacity:1;transform:none}}
.thumb{position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--cream);container-type:size;box-shadow:var(--sh);transition:transform .45s var(--spring),box-shadow .4s}
.thumb>.art{position:absolute;inset:0;transition:transform .8s var(--ease)}
@media(hover:hover){.item:hover .thumb{transform:translateY(-5px)}.item:hover .thumb>.art{transform:scale(1.06)}}
.item:active .thumb{transform:scale(.97)}
.badge{position:absolute;z-index:3;top:0;left:0;font:600 12.5px/1 var(--sans);padding:8px 12px 8px 11px;border-radius:18px 0 14px 0;display:inline-flex;align-items:center;gap:5px}
.badge.free{background:var(--wine);color:#fff}
.badge.custom{background:#fff;color:var(--wine)}
.badge svg{width:12px;height:12px;fill:currentColor}
.pv-pill{position:absolute;z-index:3;right:9px;bottom:9px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);font:500 12.5px/1 var(--sans);padding:8px 13px 8px 10px;border-radius:99px;box-shadow:0 4px 14px -4px rgba(110,0,32,.3);transition:transform .35s var(--spring),background .3s,color .3s}
.pv-pill svg{width:11px;height:11px;fill:var(--wine)}
@media(hover:hover){.item:hover .pv-pill{background:var(--wine);color:#fff}.item:hover .pv-pill svg{fill:#fff}}
.item h3{font:600 16.5px/1.25 var(--sans);color:var(--ink);margin-top:10px}
.item .th{font-size:12.5px;color:var(--ink3);line-height:1.4}
.item .price{font:500 15px/1 var(--sans);color:var(--wine);margin-top:6px}
.item .price.ask{font-size:13.5px;color:var(--ink2)}

/* floating how-to */
.fab{position:fixed;z-index:40;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 22px 0 8px;border-radius:99px;background:var(--wine);color:#fff;font:600 16px/1 var(--sans);box-shadow:0 14px 30px -10px rgba(161,0,46,.75);animation:fabIn .9s .6s var(--spring) both;transition:transform .35s var(--spring)}
.fab:active{transform:scale(.94)}
.fab .pl{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;position:relative}
.fab .pl::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.5);animation:ping 2s ease-out infinite}
.fab .pl svg{width:16px;height:16px;fill:#fff;margin-left:2px}
@keyframes fabIn{from{transform:translateY(90px) scale(.6);opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.6);opacity:0}}

/* how-to sheet content */
.how{padding:30px 22px calc(26px + env(safe-area-inset-bottom))}
.how h2{font:600 24px/1.2 var(--sans);color:var(--wine)}
.how .sub{color:var(--ink2);font-size:14px;margin:4px 0 16px}
.trk{border-radius:18px;padding:16px 16px 14px;border:1px solid var(--line);margin-bottom:12px}
.trk.dark{background:var(--wine);color:#fff;border-color:transparent}
.trk h3{font:600 17px/1.2 var(--sans);display:flex;align-items:center;gap:8px}
.trk ol{list-style:none;display:grid;gap:9px;margin:12px 0 14px}
.trk li{display:flex;gap:10px;font-size:14px;line-height:1.45}
.trk li b{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--sans);background:var(--wine-t);color:var(--wine)}
.trk.dark li b{background:#fff}
.trk li small{display:block;font-size:12.5px;opacity:.72}
.trk .btn{width:100%}

.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:99px;font:500 15px/1 var(--sans);transition:transform .35s var(--spring),background .3s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--wine);color:#fff;box-shadow:0 8px 22px -10px rgba(161,0,46,.75)}
.btn.ghost{background:#fff;color:var(--wine);border:1px solid var(--line2)}
.btn .arr{transition:transform .35s var(--spring)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn.ghost .ripple{background:rgba(161,0,46,.14)}
@keyframes rip{to{transform:scale(4);opacity:0}}

footer{text-align:center;padding:26px 20px 120px;color:var(--ink3);font-size:12.5px;background:#FFFBFC}
footer a{color:var(--wine)}
@keyframes up{to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-10px) scale(.97,1.03)}55%{transform:translateY(-10px) scale(.97,1.03)}90%{transform:translateY(0) scale(1.06,.94)}}
@keyframes tw{0%,100%{transform:scale(.4) rotate(0);opacity:.2}50%{transform:scale(1) rotate(90deg);opacity:1}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translateY(-170px) translateX(18px) scale(1.1);opacity:0}}
/* ---------- thumbnail art (shared by grid + preview) ---------- */
.art{display:flex;flex-direction:column;align-items:center;justify-content:center}
.a-bday{display:grid!important;justify-items:stretch}
.paper{position:relative;width:64%;aspect-ratio:3/4;background:#fff;border-radius:10px;box-shadow:0 10px 24px -12px rgba(92,0,23,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.paper .script{font:500 italic clamp(15px,4.6vw,22px)/1 var(--serif);color:var(--wine)}
.paper .to{font:400 9px/1 var(--sans);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.paper .ln{height:3px;border-radius:2px;background:var(--blush2);margin:3px auto 0;opacity:.8}
.dots{background-color:var(--blush);background-image:radial-gradient(#fff 2px,transparent 2.2px);background-size:16px 16px}
.lines-bg{background:var(--cream);background-image:repeating-linear-gradient(0deg,transparent 0 17px,rgba(128,0,32,.07) 17px 18px)}
.wine-bg{background:radial-gradient(120% 90% at 30% 20%,#A3253F 0%,#800020 45%,#4A0012 100%)}

/* rose */
.a-rose .rose{width:30%;margin-bottom:8px;animation:sway 4s ease-in-out infinite}
.petal{position:absolute;top:-10%;width:12px;height:12px;background:var(--wine3);border-radius:80% 0 80% 0;opacity:.85;animation:fall linear infinite}
.petal:nth-child(odd){background:var(--blush2)}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translate(30px,120%) rotate(320deg);opacity:0}}
.art .petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

/* bunny */
.a-bunny .bun{width:44%;animation:hop 1.6s var(--ease) infinite;transform-origin:50% 100%}
.a-bunny .shadow{width:26%;height:6px;border-radius:50%;background:rgba(128,0,32,.12);margin-top:-4px;animation:shad 1.6s var(--ease) infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.05,.95)}15%{transform:translateY(0) scale(.95,1.05)}45%{transform:translateY(-26%) scale(1)}75%{transform:translateY(0) scale(1.06,.94)}}
@keyframes shad{0%,100%,75%{transform:scale(1);opacity:1}45%{transform:scale(.6);opacity:.5}}
.fl-heart{position:absolute;width:13px;fill:var(--wine3);opacity:0;animation:rise 4.5s ease-in infinite}

/* velvet */
.a-velvet .box{position:relative;width:46%;aspect-ratio:1;animation:jiggle 3s ease-in-out infinite}
.box .body{position:absolute;left:6%;right:6%;bottom:0;height:68%;background:var(--cream);border-radius:6px;box-shadow:inset 0 -8px 0 rgba(183,155,108,.18)}
.box .lid{position:absolute;left:0;right:0;top:20%;height:20%;background:#fff;border-radius:5px;box-shadow:0 4px 8px rgba(0,0,0,.18);animation:lid 3s ease-in-out infinite}
.box .rib{position:absolute;top:20%;bottom:0;left:50%;width:14%;margin-left:-7%;background:var(--wine3)}
.box .bw{position:absolute;width:76%;left:12%;top:-12%;animation:lid 3s ease-in-out infinite}
@keyframes jiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-5deg)}80%{transform:rotate(5deg)}85%{transform:rotate(-3deg)}90%{transform:rotate(2deg)}}
@keyframes lid{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-14%)}}
.a-velvet .tw{position:absolute;width:14px;fill:#F3D9A4;animation:tw 2.2s ease-in-out infinite}
.a-velvet .lbl{position:absolute;bottom:9%;left:0;right:0;text-align:center;font:500 italic 17px/1 var(--serif);color:#F6DDE1}

/* letter */
.a-letter .paper{transform:rotate(-3deg)}
.a-letter .tl{height:3px;border-radius:2px;background:var(--wine);opacity:.55;margin:4px 0 0;width:0;align-self:flex-start;margin-left:8%;animation:typeln 4.2s steps(14) infinite}
.a-letter .tl:nth-of-type(2){animation-delay:.6s}.a-letter .tl:nth-of-type(3){animation-delay:1.2s}
@keyframes typeln{0%{width:0}35%,85%{width:var(--w,70%)}100%{width:var(--w,70%);opacity:0}}
.a-letter .kiss{position:absolute;width:22%;right:14%;bottom:14%;animation:stamp 4.2s var(--spring) infinite}
@keyframes stamp{0%,40%{transform:scale(2) rotate(-20deg);opacity:0}50%{transform:scale(1) rotate(-12deg);opacity:1}90%{opacity:1}100%{opacity:0}}
.a-letter .tape{position:absolute;top:13%;left:50%;width:30%;height:10%;margin-left:-15%;background:rgba(242,196,200,.75);transform:rotate(4deg)}

/* anniversary */
.polaroid{position:relative;width:62%;background:#fff;padding:7% 7% 18%;box-shadow:0 12px 26px -12px rgba(92,0,23,.4);transform:rotate(4deg);animation:polar 5s ease-in-out infinite}
.polaroid .ph{aspect-ratio:1;background:var(--blush);display:grid;place-items:center}
.polaroid .ph svg{width:62%}
.polaroid span{position:absolute;bottom:4%;left:0;right:0;text-align:center;font:400 11px/1 var(--cute);color:var(--wine)}
.polaroid .bw{position:absolute;width:40%;top:-9%;left:30%}
@keyframes polar{0%,100%{transform:rotate(4deg) translateY(0)}50%{transform:rotate(-2deg) translateY(-6px)}}
.a-anniv .rings{position:absolute;bottom:8%;right:10%;width:18%;color:var(--gold);animation:tw 3s ease-in-out infinite}


/* birthday chat (LINE-style) */
.a-bc{background:#FFFAF6;justify-content:flex-start!important;overflow:hidden}
.a-bc .bc-bunt{position:absolute;top:0;left:0;right:0;height:17cqw;background:#FDE9EF;display:flex;justify-content:space-around;padding:0 2cqw;border-bottom:1px solid #F6D3DE}
.a-bc .bc-bunt i{width:11cqw;height:10cqw;clip-path:polygon(0 0,100% 0,50% 100%);background:#F4A6C1}
.a-bc .bc-bunt i:nth-child(3n+2){background:#fff;outline:1px solid #EBC3CF}.a-bc .bc-bunt i:nth-child(3n){background:#A3123A}
.a-bc .bc-th{position:absolute;top:23cqw;left:5cqw;right:5cqw;display:flex;flex-direction:column;gap:4cqw}
.a-bc .bc-b{align-self:flex-start;font:400 7.4cqw/1.25 var(--sans);color:#3B1220;background:#fff;border:1.6px solid #8A1538;border-radius:9cqw;padding:2.2cqw 4.4cqw;white-space:nowrap;opacity:0;animation:bcpop 6s var(--spring) infinite}
.a-bc .bc-b.out{align-self:flex-end;background:#FDE3EA;color:#5A0A22}
.a-bc .bc-b:nth-child(2){animation-delay:.6s}.a-bc .bc-b:nth-child(3){animation-delay:1.2s}
.a-bc .bc-ck{width:72cqw;align-self:flex-start;margin-left:2cqw;opacity:0;animation:bcpop 6s var(--spring) 1.8s infinite;overflow:visible}
.a-bc .bc-fl{animation:bcfl .2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bcfl{to{transform:scaleY(1.2)}}
@keyframes bcpop{0%{opacity:0;transform:translateY(6px) scale(.7)}8%,88%{opacity:1;transform:none}96%,100%{opacity:0}}
.a-bc .bc-hill{position:absolute;left:-10%;right:-10%;bottom:-8cqw;height:30cqw;border-radius:50% 50% 0 0;background:#FBDDE6}

/* birthday chat (old) */
.a-bday{align-content:center;gap:6px;padding:16% 10% 0}
.bub{justify-self:start;font:400 11px/1.3 var(--sans);padding:6px 10px;border-radius:12px 12px 12px 4px;background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(92,0,23,.08);opacity:0;animation:bub 5s var(--spring) infinite}
.bub.out{justify-self:end;border-radius:12px 12px 4px 12px;background:var(--wine);color:#fff}
.bub:nth-child(2){animation-delay:.5s}.bub:nth-child(3){animation-delay:1s}.bub:nth-child(4){animation-delay:1.5s}
@keyframes bub{0%{opacity:0;transform:translateY(8px) scale(.8)}10%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
.a-bday .cake{width:38%;justify-self:center;margin-top:4px;animation:bob 3s ease-in-out infinite}

/* sorry */
.a-sorry .seal-big{width:28%;margin-bottom:6px;animation:wiggle 2.8s ease-in-out infinite}
.a-sorry .q{font:500 italic 19px/1.1 var(--serif);color:var(--wine)}
.a-sorry .yn{display:flex;gap:8px;margin-top:10px}
.a-sorry .yn i{font:500 10.5px/1 var(--sans);font-style:normal;padding:6px 11px;border-radius:99px}
.a-sorry .yn .y{background:var(--wine);color:#fff;animation:beat 2s infinite}
.a-sorry .yn .n{background:#fff;border:1px solid var(--line2);color:var(--ink2);animation:dodge 3s var(--spring) infinite}
@keyframes dodge{0%,30%{transform:none}40%{transform:translate(22px,-26px)}60%{transform:translate(-18px,-40px)}80%,100%{transform:none}}

/* ---------- preview sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(40,6,14,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;background:#fff;border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .6s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:720px;max-height:88vh;border-radius:26px;transform:translate(-50%,-44%) scale(.94);opacity:0;transition:transform .55s var(--spring),opacity .35s}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.sheet .grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 0;flex:none}
@media(min-width:760px){.sheet .grab{display:none}}
.sheet .x{position:absolute;top:12px;right:12px;z-index:5;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--wine);transition:transform .4s var(--spring)}
.sheet .x:hover{transform:rotate(90deg)}
.sheet-body{overflow-y:auto;display:grid;gap:0}
@media(min-width:760px){.sheet-body{grid-template-columns:1fr 1fr}}
.pv{position:relative;background:var(--cream);margin:12px 14px 0;border-radius:20px;height:min(52vh,420px);overflow:hidden;display:grid;place-items:center}
@media(min-width:760px){.pv{margin:14px 0 14px 14px;height:auto;min-height:440px}}
.pv .art{position:absolute;inset:0}
.pv .paper{width:56%}
.pv-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font:400 12px/1 var(--cute);color:var(--wine);background:rgba(255,255,255,.92);padding:8px 13px;border-radius:99px;box-shadow:0 4px 14px -6px rgba(92,0,23,.35);z-index:7;pointer-events:none;animation:hintP 2.4s ease-in-out infinite}
@keyframes hintP{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}

/* envelope */
.env{position:absolute;z-index:3;left:50%;top:50%;width:min(70%,260px);aspect-ratio:1.45;transform:translate(-50%,-40%);cursor:pointer;transition:transform .9s var(--ease),opacity .6s .3s}
.env .back{position:absolute;inset:0;background:#EEDFE2;border-radius:8px}
.env .front{position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,transparent 49.5%,#F7EEF0 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#F7EEF0 50%) right/50% 100% no-repeat;z-index:3}
.env .front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:#fff;clip-path:polygon(0 100%,50% 18%,100% 100%);border-radius:0 0 8px 8px}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#F9F2F3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform .7s var(--ease),z-index 0s .35s;box-shadow:inset 0 2px 0 rgba(0,0,0,.03)}
.env .wx{position:absolute;z-index:5;width:22%;left:39%;top:40%;transition:transform .5s var(--spring),opacity .4s;animation:beat 2.2s infinite}
.env .to{position:absolute;z-index:5;left:0;right:0;bottom:12%;text-align:center;font:500 italic 16px/1 var(--serif);color:var(--wine)}
.env:not(.open):hover{transform:translate(-50%,-42%) rotate(-2deg)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .wx{transform:scale(0) rotate(90deg);opacity:0;animation:none}
.env.open{transform:translate(-50%,40%);opacity:0;pointer-events:none}
.pv .inner{position:absolute;inset:0;opacity:0;transform:translateY(30px) scale(.9);transition:opacity .7s .35s,transform .9s .35s var(--spring)}
.pv.opened .inner{opacity:1;transform:none}
.pv .burst-layer{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.bp{position:absolute;width:14px;height:14px;pointer-events:none}
.bp svg{width:100%;height:100%}
.pv .replay{position:absolute;z-index:6;top:10px;left:10px;font:500 11.5px/1 var(--sans);padding:7px 11px;border-radius:99px;background:#fff;color:var(--wine);border:1px solid var(--line);display:inline-flex;gap:5px;align-items:center;opacity:0;transition:opacity .4s .8s}
.pv.opened .replay{opacity:1}
.pv .replay svg{width:13px;height:13px}
/* interactive sorry in preview */
.pv .a-sorry .yn button{font:500 13px/1 var(--sans);padding:9px 16px;border-radius:99px;transition:transform .45s var(--spring)}
.pv .a-sorry .yn .y{background:var(--wine);color:#fff}
.pv .a-sorry .yn .n{background:#fff;border:1px solid var(--line2);color:var(--ink2)}
.pv .a-sorry .res{font:500 13px/1 var(--cute);color:var(--wine);margin-top:12px;animation:up .5s var(--spring) both}

.info{padding:18px 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.info .kicker{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.info h2{font:500 36px/1 var(--serif);color:var(--wine)}
.info .thd{color:var(--ink2);font-size:14px}
.info .p-row{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:4px 0}
.info .p-row .price{font-size:22px;font-family:var(--serif)}
.info .p-row small{color:var(--ink3);font-size:12.5px}
.fx{list-style:none;display:grid;gap:8px}
.fx li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink2);opacity:0;transform:translateX(-8px)}
.sheet.on .fx li{animation:slideIn .5s var(--ease) forwards;animation-delay:calc(.35s + var(--i)*80ms)}
@keyframes slideIn{to{opacity:1;transform:none}}
.fx svg{width:17px;height:17px;color:var(--wine);margin-top:2px}
.info .actions{display:grid;gap:8px;margin-top:6px}
.info .actions .btn{width:100%;height:50px}

.sheet-body:has(.how){display:block}.info h2{color:var(--wine)}
/* type system: Mali bold = headings, Mitr = UI labels/buttons, Athiti = body text */

footer{border-top:1px solid var(--line)}
/* header: wine band */
.head{background:radial-gradient(120% 140% at 50% 0%,#B8123F 0%,#A1002E 45%,#7A0022 100%)}
.head::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:16px 16px}
.head::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#E8C98F 20%,#F6E3B8 50%,#E8C98F 80%,transparent);opacity:.75}

/* tile with phone */
.thumb{aspect-ratio:4/5;background:linear-gradient(165deg,#FFFFFF 0%,#FBEFF2 100%);border:1px solid var(--line);box-shadow:none;container-type:normal}
.thumb::after{content:"";position:absolute;left:50%;bottom:4%;width:46%;height:5%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(rgba(110,0,32,.22),transparent 70%)}

function burst(layer,x,y,kind,n){
  if(reduced)return;
  for(var i=0;i<(n||16);i++){
    var p=document.createElement("span");p.className="bp";p.innerHTML=SHAPES[kind]();
    var sz=10+Math.random()*14;p.style.width=p.style.height=sz+"px";p.style.left=(x-sz/2)+"px";p.style.top=(y-sz/2)+"px";
    layer.appendChild(p);
    var a=Math.random()*Math.PI*2,d=60+Math.random()*110,dx=Math.cos(a)*d,dy=Math.sin(a)*d-40;
    var an=p.animate([{transform:"translate(0,0) scale(.3) rotate(0)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) scale(1) rotate("+(Math.random()*240-120)+"deg)",opacity:1,offset:.6},{transform:"translate("+dx*1.1+"px,"+(dy+90)+"px) scale(.8) rotate("+(Math.random()*360)+"deg)",opacity:0}],{duration:1300+Math.random()*600,easing:"cubic-bezier(.2,.8,.3,1)"});
    an.onfinish=(function(el){return function(){el.remove();};})(p);
  }
}
