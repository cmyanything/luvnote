<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuvNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mitr:wght@300;400;500&family=Sriracha&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#800020; --bg-deep:#5e0018; --white:#ffffff; --blush:#f7e4e8; --pink:#f3c6cf;
  --ink:#4a0013; --muted:#9a5866; --line:rgba(128,0,32,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Mitr",sans-serif;font-weight:300;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.view{display:none;min-height:100vh}
.view.on{display:block}

/* ---------- header ---------- */
.top{background:var(--bg);color:var(--white);text-align:center;padding:44px 20px 56px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:28px;background:var(--white);border-radius:50% 50% 0 0/100% 100% 0 0}
.logo{font-family:"Cormorant Garamond",serif;font-size:44px;font-weight:600;letter-spacing:.5px}
.logo span{font-style:italic;font-weight:500}
.tag{font-size:14px;opacity:.85;margin-top:6px;letter-spacing:.3px}
.sparkle{position:absolute;color:var(--pink);opacity:.6;font-size:14px}

.wrap{max-width:520px;margin:0 auto;padding:8px 20px 48px}
h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:24px;text-align:center;margin:12px 0 4px;color:var(--bg)}
.sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:20px}

/* ---------- template grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tpl{border:1px solid var(--line);border-radius:18px;padding:10px;background:var(--white);text-align:center;transition:transform .2s, box-shadow .2s}
.tpl:active{transform:scale(.97)}
.tpl .thumb{aspect-ratio:3/4;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.tpl .name{font-size:14px;margin-top:8px;font-weight:400}
.tpl .desc{font-size:11px;color:var(--muted)}

/* ---------- form ---------- */
.back{font-size:14px;color:var(--bg);padding:16px 20px 0;display:inline-block}
.preview-mini{width:150px;margin:6px auto 18px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-weight:300;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fffafb;outline:none}
input:focus,textarea:focus{border-color:var(--bg)}
textarea{min-height:130px;resize:vertical;line-height:1.6}
.count{text-align:right;font-size:11px;color:var(--muted);margin-top:4px}
.btn{display:block;width:100%;background:var(--bg);color:var(--white);border-radius:999px;padding:14px;font-size:16px;font-weight:400;margin-top:22px;letter-spacing:.3px;box-shadow:0 6px 18px rgba(128,0,32,.25)}
.btn:active{background:var(--bg-deep)}
.btn.ghost{background:var(--white);color:var(--bg);border:1px solid var(--bg);box-shadow:none;margin-top:12px}
.err{color:var(--bg);font-size:13px;margin-top:10px;text-align:center;min-height:18px}

/* ---------- share ---------- */
.done{text-align:center;padding-top:30px}
.done .big{font-size:48px}
.linkbox{word-break:break-all;font-size:12px;background:var(--blush);border-radius:12px;padding:12px;margin-top:16px;color:var(--ink);max-height:90px;overflow:auto;text-align:left}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}

/* ---------- card view ---------- */
#view-card{background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px 18px}
#view-card.on{display:flex}
.stage{width:100%;max-width:380px;perspective:1200px}
.envelope{position:relative;width:100%;aspect-ratio:4/3;margin-top:40px;cursor:pointer}
.env-body{position:absolute;inset:0;background:var(--white);border-radius:10px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.env-flap{position:absolute;left:0;right:0;top:0;height:60%;background:var(--blush);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:3;border-radius:10px 10px 0 0}
.env-seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--bg);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:24px;z-index:4;box-shadow:0 4px 10px rgba(0,0,0,.25);transition:opacity .3s}
.env-to{position:absolute;bottom:14%;left:0;right:0;text-align:center;font-family:"Sriracha",cursive;color:var(--bg);font-size:18px;z-index:2}
.tap{color:var(--pink);text-align:center;font-size:13px;margin-top:18px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.envelope.open .env-flap{transform:rotateX(180deg)}
.envelope.open .env-seal{opacity:0}
.card-out{display:none}
.card-out.on{display:block;animation:rise .8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.95)}to{opacity:1;transform:none}}
.card-actions{width:100%;max-width:380px;margin-top:18px;display:none}
.card-actions.on{display:block}
.card-actions .btn{background:var(--white);color:var(--bg);box-shadow:none}

/* ---------- the card itself ---------- */
.card{position:relative;width:100%;aspect-ratio:3/4;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 26px}
.card .c-to{font-family:"Sriracha",cursive;font-size:20px;margin-bottom:10px;position:relative;z-index:2}
.card .c-msg{font-family:"Sriracha",cursive;font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:break-word;position:relative;z-index:2;max-height:58%;overflow:auto}
.card .c-from{font-family:"Sriracha",cursive;font-size:16px;margin-top:14px;position:relative;z-index:2}
.card .deco{position:absolute;z-index:1;pointer-events:none}
/* mini (thumb) scale */
.mini .card{padding:10px;border-radius:10px}
.mini .card .c-to{font-size:9px;margin-bottom:4px}
.mini .card .c-msg{font-size:7px;line-height:1.5;max-height:50%;overflow:hidden}
.mini .card .c-from{font-size:7px;margin-top:4px}

/* template: rose — quiet luxury */
.t-rose{background:var(--white);color:var(--bg);border:1px solid var(--line)}
.t-rose::before{content:"";position:absolute;inset:10px;border:1px solid rgba(128,0,32,.35);border-radius:10px;z-index:1}
.mini .t-rose::before{inset:5px;border-radius:6px}
.t-rose .rose-top{top:4%;left:50%;transform:translateX(-50%);width:34%}
.t-rose .rose-bot{bottom:4%;left:50%;transform:translateX(-50%) rotate(180deg);width:22%;opacity:.5}

/* template: bunny — kawaii */
.t-bunny{background:var(--blush);color:var(--ink)}
.t-bunny .bun{bottom:-2%;right:-4%;width:42%}
.t-bunny .hearts{top:6%;left:8%;width:26%}
.t-bunny .c-to{color:var(--bg)}

/* template: velvet — burgundy */
.t-velvet{background:radial-gradient(circle at 50% 30%,#9a0a2e,var(--bg) 60%,var(--bg-deep));color:var(--white)}
.t-velvet::before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.4);border-radius:10px;z-index:1}
.mini .t-velvet::before{inset:5px;border-radius:6px}
.t-velvet .bow{top:3%;left:50%;transform:translateX(-50%);width:30%}
.t-velvet .stars{bottom:6%;left:50%;transform:translateX(-50%);width:50%;opacity:.8}

/* template: letter — love letter */
.t-letter{background:repeating-linear-gradient(#fff 0 27px,#f6dde3 27px 28px);color:var(--ink)}
.t-letter .tape{top:-1%;left:50%;transform:translateX(-50%) rotate(-3deg);width:36%}
.t-letter .kiss{bottom:5%;right:7%;width:22%}
.t-letter .c-to,.t-letter .c-from{color:var(--bg)}

footer{text-align:center;font-size:11px;color:var(--muted);padding:10px 0 30px}
#view-card footer{color:var(--pink);opacity:.7}
</style>
</head>
<body>

<!-- HOME -->
<section id="view-home" class="view on">
  <div class="top">
    <span class="sparkle" style="left:12%;top:24%">✦</span>
    <span class="sparkle" style="right:14%;top:34%">♡</span>
    <span class="sparkle" style="left:22%;bottom:30%">·</span>
    <div class="logo">Luv<span>Note</span></div>
    <div class="tag">การ์ดดิจิทัล ส่งความรู้สึกด้วยลิงก์เดียว</div>
  </div>
  <div class="wrap">
    <h2>เลือกการ์ดที่ชอบ</h2>
    <p class="sub">แตะเพื่อเริ่มเขียนข้อความของคุณ</p>
    <div class="grid" id="grid"></div>
  </div>
  <footer>made with ♡ by LuvNote</footer>
</section>

<!-- CREATE -->
<section id="view-create" class="view">
  <button class="back" id="backBtn">‹ เลือกการ์ดใหม่</button>
  <div class="wrap">
    <h2 id="createTitle">เขียนการ์ด</h2>
    <div class="preview-mini mini" id="livePreview"></div>
    <form id="form" novalidate>
      <label for="to">ถึง</label>
      <input id="to" maxlength="40" placeholder="เช่น ที่รักของเค้า" autocomplete="off">
      <label for="msg">ข้อความ</label>
      <textarea id="msg" maxlength="400" placeholder="เขียนสิ่งที่อยากบอก..."></textarea>
      <div class="count"><span id="cnt">0</span>/400</div>
      <label for="from">จาก</label>
      <input id="from" maxlength="40" placeholder="ชื่อของคุณ" autocomplete="off">
      <div class="err" id="err"></div>
      <button class="btn" type="submit">สร้างการ์ด ♡</button>
    </form>
  </div>
</section>

<!-- DONE -->
<section id="view-done" class="view">
  <div class="wrap done">
    <div class="big">💌</div>
    <h2>การ์ดพร้อมส่งแล้ว!</h2>
    <p class="sub">คัดลอกลิงก์แล้วส่งให้คนพิเศษได้เลย</p>
    <div class="mini" style="width:150px;margin:0 auto" id="donePreview"></div>
    <button class="btn" id="copyBtn">คัดลอกลิงก์</button>
    <div class="linkbox" id="linkBox"></div>
    <button class="btn ghost" id="openBtn">ดูการ์ดแบบที่ผู้รับเห็น</button>
    <button class="btn ghost" id="newBtn">สร้างการ์ดใหม่</button>
    <p class="note" id="copyNote"></p>
  </div>
</section>

<!-- CARD (recipient) -->
<section id="view-card" class="view">
  <div class="stage">
    <div class="envelope" id="env">
      <div class="env-body"></div>
      <div class="env-flap"></div>
      <div class="env-seal">♥</div>
      <div class="env-to" id="envTo"></div>
    </div>
    <div class="tap" id="tap">แตะซองเพื่อเปิดการ์ด</div>
    <div class="card-out" id="cardOut"></div>
  </div>
  <div class="card-actions" id="cardActions">
    <button class="btn" id="makeOwn">สร้างการ์ดของคุณเอง ♡</button>
  </div>
  <footer>LuvNote</footer>
</section>

<script>
/* ===== Set after publishing: the artifact's public link ===== */
var BASE_URL = "";

/* ===== decorations (inline SVG) ===== */
var SVG = {
  rose:'<svg viewBox="0 0 100 100"><g fill="none" stroke="#800020" stroke-width="2.2" stroke-linecap="round"><path d="M50 30c-9 0-15 6-15 13 0 8 7 13 15 13s15-5 15-13c0-7-6-13-15-13z" fill="#f7e4e8"/><path d="M50 36c-5 0-8 3-8 7s4 7 8 7 8-3 8-7"/><path d="M50 40c-2 0-3 1-3 3"/><path d="M50 56v26"/><path d="M50 68c-6-6-14-6-18-2 5 4 12 5 18 2z" fill="#f7e4e8"/><path d="M50 72c6-6 14-6 18-2-5 4-12 5-18 2z" fill="#f7e4e8"/></g></svg>',
  bunny:'<svg viewBox="0 0 100 100"><g stroke="#800020" stroke-width="2" fill="#fff"><ellipse cx="38" cy="22" rx="7" ry="20"/><ellipse cx="60" cy="22" rx="7" ry="20"/><ellipse cx="38" cy="24" rx="3" ry="13" fill="#f3c6cf" stroke="none"/><ellipse cx="60" cy="24" rx="3" ry="13" fill="#f3c6cf" stroke="none"/><ellipse cx="50" cy="62" rx="32" ry="28"/></g><circle cx="39" cy="58" r="3" fill="#4a0013"/><circle cx="61" cy="58" r="3" fill="#4a0013"/><ellipse cx="32" cy="66" rx="5" ry="3" fill="#f3c6cf"/><ellipse cx="68" cy="66" rx="5" ry="3" fill="#f3c6cf"/><path d="M46 64q4 4 8 0" stroke="#4a0013" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
  hearts:'<svg viewBox="0 0 100 100"><path d="M30 40c-8-12-26-4-18 10l18 16 18-16c8-14-10-22-18-10z" fill="#800020"/><path d="M70 22c-5-7-16-2-11 6l11 10 11-10c5-8-6-13-11-6z" fill="#f3c6cf"/><path d="M68 70c-4-6-13-2-9 5l9 8 9-8c4-7-5-11-9-5z" fill="#800020" opacity=".6"/></svg>',
  bow:'<svg viewBox="0 0 100 60"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M50 30C38 14 16 10 16 26s22 16 34 4z"/><path d="M50 30c12-16 34-20 34-4S62 42 50 30z"/><path d="M46 32l-10 24M54 32l10 24"/><circle cx="50" cy="30" r="5" fill="#fff"/></g></svg>',
  stars:'<svg viewBox="0 0 120 20"><g fill="#f3c6cf"><path d="M10 10l2-6 2 6 6 2-6 2-2 6-2-6-6-2z"/><path d="M60 10l2-6 2 6 6 2-6 2-2 6-2-6-6-2z"/><path d="M110 10l2-6 2 6 6 2-6 2-2 6-2-6-6-2z"/><circle cx="35" cy="12" r="1.5"/><circle cx="85" cy="12" r="1.5"/></g></svg>',
  tape:'<svg viewBox="0 0 100 26"><rect x="2" y="2" width="96" height="22" rx="2" fill="#f3c6cf" opacity=".85"/><path d="M2 2l4 4-4 4 4 4-4 4 4 4M98 2l-4 4 4 4-4 4 4 4-4 4" stroke="#fff" fill="none"/></svg>',
  kiss:'<svg viewBox="0 0 100 70"><path d="M10 35c10-18 28-22 40-10 12-12 30-8 40 10-14 4-26 4-40 0-14 4-26 4-40 0z" fill="#800020"/><path d="M10 35c14 20 66 20 80 0-14 6-26 8-40 6-14 2-26 0-40-6z" fill="#a3143c"/></svg>'
};

var TEMPLATES = [
  {id:"rose",   name:"Rosé",    desc:"เรียบหรู มินิมอล", deco:'<div class="deco rose-top">'+SVG.rose+'</div><div class="deco rose-bot">'+SVG.rose+'</div>'},
  {id:"bunny",  name:"Bunny",   desc:"คาวาอี้ น่ารักนุ่มฟู", deco:'<div class="deco hearts">'+SVG.hearts+'</div><div class="deco bun">'+SVG.bunny+'</div>'},
  {id:"velvet", name:"Velvet",  desc:"เบอร์กันดีสุดคลาสสิก", deco:'<div class="deco bow">'+SVG.bow+'</div><div class="deco stars">'+SVG.stars+'</div>'},
  {id:"letter", name:"Letter",  desc:"จดหมายรักลายเส้น", deco:'<div class="deco tape">'+SVG.tape+'</div><div class="deco kiss">'+SVG.kiss+'</div>'}
];
function tplById(id){for(var i=0;i<TEMPLATES.length;i++)if(TEMPLATES[i].id===id)return TEMPLATES[i];return TEMPLATES[0];}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function cardHTML(d){
  var t=tplById(d.t);
  return '<div class="card t-'+t.id+'">'+t.deco+
    '<div class="c-to">ถึง '+esc(d.to||"...")+'</div>'+
    '<div class="c-msg">'+esc(d.msg||"ข้อความของคุณจะอยู่ตรงนี้ ♡")+'</div>'+
    '<div class="c-from">จาก '+esc(d.from||"...")+'</div></div>';
}

/* ===== encode card into a hash made only of letters/digits/hyphens ===== */
function encode(d){
  var json=JSON.stringify([d.t,d.to,d.msg,d.from]);
  var bytes=new TextEncoder().encode(json), hex="";
  for(var i=0;i<bytes.length;i++)hex+=(bytes[i]<16?"0":"")+bytes[i].toString(16);
  return "c-"+hex;
}
function decode(h){
  try{
    if(h.indexOf("c-")!==0)return null;
    var hex=h.slice(2); if(!/^[0-9a-f]+$/.test(hex)||hex.length%2)return null;
    var b=new Uint8Array(hex.length/2);
    for(var i=0;i<b.length;i++)b[i]=parseInt(hex.substr(i*2,2),16);
    var a=JSON.parse(new TextDecoder().decode(b));
    return {t:a[0],to:a[1],msg:a[2],from:a[3]};
  }catch(e){return null;}
}

/* ===== views ===== */
var current={t:"rose",to:"",msg:"",from:""}, lastHash="";
function show(id){
  var v=document.querySelectorAll(".view");
  for(var i=0;i<v.length;i++)v[i].classList.remove("on");
  document.getElementById("view-"+id).classList.add("on");
  window.scrollTo(0,0);
}
function setHash(h){ try{ if(location.hash!=="#"+h){ if(h) location.hash=h; else history.replaceState(null,"",location.pathname+location.search);} }catch(e){} }

function renderHome(){
  var g=document.getElementById("grid"),html="";
  TEMPLATES.forEach(function(t){
    html+='<button class="tpl" data-t="'+t.id+'"><div class="thumb mini">'+cardHTML({t:t.id,to:"คนพิเศษ",msg:"รักนะ ♡",from:"เค้า"})+'</div><div class="name">'+t.name+'</div><div class="desc">'+t.desc+'</div></button>';
  });
  g.innerHTML=html;
  g.querySelectorAll(".tpl").forEach(function(b){b.onclick=function(){startCreate(b.getAttribute("data-t"));};});
}
function startCreate(tid){
  current.t=tid;
  document.getElementById("createTitle").textContent="เขียนการ์ด "+tplById(tid).name;
  updatePreview(); show("create");
}
function updatePreview(){
  current.to=document.getElementById("to").value.trim();
  current.msg=document.getElementById("msg").value;
  current.from=document.getElementById("from").value.trim();
  document.getElementById("cnt").textContent=current.msg.length;
  document.getElementById("livePreview").innerHTML=cardHTML(current);
}
["to","msg","from"].forEach(function(id){document.getElementById(id).addEventListener("input",updatePreview);});

document.getElementById("form").addEventListener("submit",function(e){
  e.preventDefault(); updatePreview();
  var err=document.getElementById("err");
  if(!current.to||!current.msg.trim()||!current.from){err.textContent="กรอกให้ครบทั้ง ถึง ข้อความ และ จาก นะ ♡";return;}
  err.textContent="";
  lastHash=encode({t:current.t,to:current.to,msg:current.msg.trim(),from:current.from});
  var link=(BASE_URL||"")+"#"+lastHash;
  document.getElementById("linkBox").textContent=BASE_URL?link:"(ลิงก์จะใช้ได้หลังเว็บเผยแพร่)";
  document.getElementById("donePreview").innerHTML=cardHTML(current);
  document.getElementById("copyNote").textContent="";
  show("done");
});
document.getElementById("copyBtn").onclick=function(){
  var link=(BASE_URL||location.href.split("#")[0])+"#"+lastHash, note=document.getElementById("copyNote");
  function fallback(){
    var r=document.createRange(),box=document.getElementById("linkBox");
    r.selectNodeContents(box); var s=getSelection(); s.removeAllRanges(); s.addRange(r);
    note.textContent="กดค้างที่ลิงก์ด้านบนแล้วเลือก “คัดลอก” ได้เลย";
  }
  try{
    navigator.clipboard.writeText(link).then(function(){note.textContent="คัดลอกแล้ว! วางในแชตเพื่อส่งได้เลย ♡";},fallback);
  }catch(e){fallback();}
};
document.getElementById("openBtn").onclick=function(){setHash(lastHash);route();};
document.getElementById("newBtn").onclick=function(){
  ["to","msg","from"].forEach(function(id){document.getElementById(id).value="";});
  setHash(""); show("home");
};
document.getElementById("backBtn").onclick=function(){show("home");};
document.getElementById("makeOwn").onclick=function(){setHash("");show("home");};

function openCard(d){
  var env=document.getElementById("env"),out=document.getElementById("cardOut");
  env.classList.remove("open"); env.style.display=""; out.classList.remove("on");
  document.getElementById("tap").style.display="";
  document.getElementById("cardActions").classList.remove("on");
  document.getElementById("envTo").textContent="ถึง "+d.to;
  out.innerHTML=cardHTML(d);
  env.onclick=function(){
    env.classList.add("open"); document.getElementById("tap").style.display="none";
    setTimeout(function(){env.style.display="none";out.classList.add("on");document.getElementById("cardActions").classList.add("on");},750);
  };
  show("card");
}
function route(){
  var h=(location.hash||"").slice(1), d=decode(h);
  if(d)openCard(d); else show("home");
}
window.addEventListener("hashchange",route);
renderHome(); route();
</script>
</body>
</html>
