# Safe isolated staging Worker: copy to wrangler.staging.toml, replace the D1 id and validate.
# This file is a TEMPLATE. Do not deploy it without replacing the placeholder.
# No custom routes: staging stays off api.luvnote.fun.
name = "luvnote-api-staging"
main = "worker/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# STAGING ONLY. Never copy test configuration into production.
[vars]
ENVIRONMENT = "staging"
MEDIA_V3_UPLOADS_ENABLED = "false"
MEDIA_CLEANUP_ENABLED = "true"
# Images.info() FAILED real corrupt-pixel acceptance. Keep strict decoding and writes disabled.
# Operator-only diagnostics can select "images" (rejected info-only method) or
# "images-transform" (Full Transformation; Free CPU acceptance still FAILED).
# Both are staging-only. Keep this default; see the report and exhausted test budget.
MEDIA_JPEG_VALIDATOR = "legacy"
TURNSTILE_TEST_MODE = "true"
TURNSTILE_HOSTNAMES = "localhost,127.0.0.1"

[[d1_databases]]
binding = "DB"
database_name = "luvnote-staging"
database_id = "REPLACE_WITH_STAGING_D1_UUID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "luvnote-media-staging"

# Unused in legacy mode. Full-transformation diagnostics require confirmed Images
# Free and an explicit staging window; never change billing or production here.
[images]
binding = "IMAGES"

[triggers]
crons = ["0 * * * *"]

# Separate namespace from the future production binding. Approximate per-colocation burst guard.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "472002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "472004"
simple = { limit = 300, period = 60 }
